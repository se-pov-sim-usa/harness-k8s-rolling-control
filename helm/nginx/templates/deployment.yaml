apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-nginx
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: helm-nginx
  template:
    metadata:
      labels:
        app: helm-nginx
        tier: {{ .Values.tier }}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
